; Rename this file to .user.ini and put it in the site root (public_html).
; Interim mitigation for PHP2Shell (CVE-2026-109619), blocks the confirmed
; session upload-progress attack path. It is NOT a full fix: update PHP.
; ScratchNews does not use upload progress tracking, so nothing breaks.
; PHP re-reads .user.ini every few minutes (user_ini.cache_ttl, default 300s).
session.upload_progress.enabled = 0
